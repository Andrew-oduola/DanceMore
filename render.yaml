services:
  - type: web
    name: dancemore-api
    runtime: python
    plan: free
    rootDir: dancemore-api
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo"
    startCommand: "gunicorn dancemore_api.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "dancemore.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
